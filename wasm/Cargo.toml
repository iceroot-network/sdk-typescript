[package]
name = "iceroot-sdk-wasm"
description = "WebAssembly bindings of the IceRoot SDK"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/iceroot-network/sdk-typescript"
publish = false

# The bindings build on their own; this crate is not part of another workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Test seam: reproducible signatures for the cross-checks against native Rust. Only the test build
# of the package enables it; the published build never does.
fixed-aux = ["heartwood-crypto/fixed-aux"]

[dependencies]
# The byte-exact layer: keys, addresses and signatures come from here and nowhere else.
heartwood-crypto = { git = "ssh://git@github-iceroot/iceroot-network/heartwood-core.git", rev = "c01da1e" }
js-sys = "0.3"
wasm-bindgen = "=0.2.129"
zeroize = "1.9"

# WebAssembly only: randomness from crypto.getRandomValues, and libsecp256k1's small precomputed
# tables. Signatures and keys are identical with either table size; native builds keep the default.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std", "lowmemory"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# Prints the native Rust results that every JavaScript context must reproduce.
[[example]]
name = "vectors"
required-features = ["fixed-aux"]

[lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = true
